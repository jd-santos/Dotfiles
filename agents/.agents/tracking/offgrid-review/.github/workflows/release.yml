name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
          enable-cache: false

      - name: Verify the release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$tag_version" = "$package_version"

      - name: Run Python tests
        run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Sync browser test dependencies
        run: uv sync --locked --group test

      - name: Install Chromium
        run: uv run --frozen --group test playwright install --with-deps chromium

      - name: Check embedded JavaScript syntax
        run: uv run --frozen python scripts/check_runtime_syntax.py

      - name: Run browser regressions
        run: uv run --frozen --group test python -m unittest discover -s tests/browser -p 'test_*.py' -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$PWD/dist" -name '*.whl' -print -quit)"
          work="$(mktemp -d)"
          UV_CACHE_DIR="$work/cache" uvx --from "$wheel" offgrid-review \
            --data skills/offgrid-review/examples/review-data.json \
            --spec skills/offgrid-review/examples/review-spec.json \
            --out "$work/review.html"
          grep -q 'SPDX-License-Identifier: Apache-2.0' "$work/review.html"
          grep -q '"artifact_fingerprint": "sha256:' "$work/review.html"
          grep -q 'Download decisions' "$work/review.html"

      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish with Trusted Publishing
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
          enable-cache: false

      - name: Publish wheel and source distribution
        run: uv publish --trusted-publishing always dist/*
