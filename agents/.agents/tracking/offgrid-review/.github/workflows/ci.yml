name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync the locked project
        run: uv sync --locked

      - name: Run tests
        run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py' -q

  browser:
    name: Browser regressions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
          python-version: "3.14"
          enable-cache: true

      - name: Sync browser test dependencies
        run: uv sync --locked --group test

      - name: Install Chromium
        run: uv run --frozen --group test playwright install --with-deps chromium

      - name: Check embedded JavaScript syntax
        run: uv run --frozen python scripts/check_runtime_syntax.py

      - name: Run browser regressions
        run: uv run --frozen --group test python -m unittest discover -s tests/browser -p 'test_*.py' -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [test, browser]

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test the wheel through UVX
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -name '*.whl' -print -quit)"
          work="$(mktemp -d)"
          uvx --from "$wheel" offgrid-review --version
          uvx --from "$wheel" offgrid-review \
            --data skills/offgrid-review/examples/review-data.json \
            --spec skills/offgrid-review/examples/review-spec.json \
            --out "$work/review.html"
          test -s "$work/review.html"
          grep -q 'SPDX-License-Identifier: Apache-2.0' "$work/review.html"
          grep -q '"artifact_fingerprint": "sha256:' "$work/review.html"
          grep -q 'Download decisions' "$work/review.html"
