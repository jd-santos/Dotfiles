<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Pi permission hotkeys and narrower session scopes</title>
  <desc id="desc">Two example terminal panels for npm test. The first offers local hotkeys: a to allow once, y to enable session YOLO, d to deny once, m for More options, v to view the full command, and n to add a note. Allow once is selected by default. The second shows More options, Allow for this session: exact operation, all write and edit operations, bash tool, npm executable, and one relevant directory. This is a recreation, not a screenshot. High-risk confirmation and sensitive-read blocks still apply.</desc>
  <rect width="1100" height="600" rx="12" fill="#1e1e2e"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" fill="#cdd6f4">
    <text x="30" y="36" font-size="13" fill="#7f849c">PERMISSION GATE · RECREATION / EXAMPLE DATA</text>
    <text x="30" y="75" font-size="18" fill="#89b4fa">Choose an action or press its hotkey</text>
    <text x="572" y="75" font-size="18" fill="#89b4fa">More options → Allow for this session</text>
    <rect x="22" y="94" width="516" height="427" rx="8" fill="#181825"/>
    <rect x="564" y="94" width="514" height="427" rx="8" fill="#181825"/>
    <g font-size="16">
      <text x="40" y="128" fill="#89b4fa">Permission required</text>
      <text x="40" y="155">Allow bash command?</text>
      <text x="40" y="190"><tspan fill="#a6adc8">Summary: </tspan>npm</text>
      <text x="40" y="217" fill="#a6adc8">Raw command:</text>
      <text x="59" y="244" fill="#7f849c">npm test</text>
      <text x="40" y="282" fill="#89b4fa">→ [a] Allow once</text>
      <text x="59" y="312">[y] Enable YOLO for this session</text>
      <text x="59" y="342">[d] Deny</text>
      <text x="59" y="372">[m] More options…</text>
      <text x="59" y="402">[v] View full command</text>
      <text x="59" y="432">[n] Add note…</text>
      <text x="40" y="466" font-size="13" fill="#a6adc8">YOLO auto-approves ordinary operations.</text>
      <text x="40" y="485" font-size="13" fill="#a6adc8">Risky operations still ask.</text>
      <text x="40" y="508" font-size="12" fill="#7f849c">up/down move · enter selects · esc/ctrl+c denies once</text>
      <text x="582" y="128" fill="#89b4fa">Permission required</text>
      <text x="582" y="155">Allow for this session:</text>
      <text x="582" y="190"><tspan fill="#a6adc8">Summary: </tspan>npm</text>
      <text x="582" y="217" fill="#a6adc8">Raw command:</text>
      <text x="601" y="244" fill="#7f849c">npm test</text>
      <text x="582" y="282"><tspan fill="#cba6f7">→ </tspan>📌 This exact operation for this session</text>
      <text x="601" y="312">✍️  All write + edit operations</text>
      <text x="601" y="342">🔧 This tool type (bash)</text>
      <text x="601" y="372">⌨️  npm for this session</text>
      <text x="601" y="402">📁 This directory (/workspace/demo/)</text>
    </g>
    <text x="30" y="553" font-size="15" fill="#a6adc8">Session rules reset between sessions. Canceling a scope picker returns without approval.</text>
    <text x="30" y="579" font-size="15" fill="#f9e2af">YOLO doesn't bypass sensitive-read blocks or high-risk confirmations. This isn't a sandbox.</text>
  </g>
</svg>
